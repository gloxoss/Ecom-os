name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: engine-import guard
        run: pnpm guard

      - run: pnpm -r lint
      - run: pnpm -r typecheck
      - run: pnpm test:coverage
      - run: pnpm hub:test

      # Backend declaration gate: required companion plugins present, real HPOS
      # opt-in, and version headers declared. Static metadata only - the live
      # HPOS / Store API exercise needs WordPress + WooCommerce and stays in
      # plugins/tests, which CI deliberately does not run (see
      # docs/ecomos/evidence/ECO-1203/report.md).
      - name: backend compatibility gate
        run: pnpm exec tsx scripts/verify-backend-compatibility.ts

      # Plugin contract suites (node:test, no WordPress or database needed).
      - run: node --test plugins/wp-ecomos-operations/tests/*.spec.mjs plugins/wp-ecomos-addons/tests/*.spec.mjs

      # Production runtime security invariants: CSP + nonce integrity, account
      # route containment, private no-store on the revalidate route, fail-closed
      # production config. Runs from apps/storefront so the `@/` tsconfig paths
      # and next-intl's `next/server` import resolve.
      - name: production runtime security checks
        working-directory: apps/storefront
        run: pnpm exec tsx ../../scripts/verify-production-runtime.mjs

      # Secret scanning
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Dependency vulnerability scan
      - uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL
          exit-code: 1

      - run: pnpm --filter storefront build
        env:
          ECOM_ENGINE: woocommerce
          WC_GRAPHQL_URL: https://woocommerce.example.test/graphql
          WC_REST_URL: https://woocommerce.example.test/wp-json/wc/v3
          WC_REST_KEY: ci-placeholder
          WC_REST_SECRET: ci-placeholder
          ECOM_OS_ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
          REVALIDATE_SECRET: test-revalidate-secret-32byteslong!
          SESSION_COOKIE_SECRET: test-session-secret-32byteslong!!
          DEFAULT_LOCALE: en
          LOCALES: en,fr,ar
          ADDONS: ""
